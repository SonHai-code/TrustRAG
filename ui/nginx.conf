server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri /index.html;
  }

  # same /api prefix as the Vite dev proxy; trailing slash strips it before forwarding
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;          # needed for streaming (SSE) answers
    proxy_read_timeout 300s;
  }
}
